# Both project and patch coverage are enforced at 90% (with a 1% threshold on
# project coverage to absorb minor line-count shifts), matching the 90% line
# coverage floor in vitest.config.ts.
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 90%

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  hide_project_coverage: true
  require_changes: false
